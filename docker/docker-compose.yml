services:
  hpc:
    build:
      # El contexto es la raíz del repo; las rutas son relativas a este archivo.
      context: ..
      dockerfile: docker/Dockerfile
    image: parallel-benchmark-hpc:latest
    volumes:
      - ../:/work
    working_dir: /work
    stdin_open: true
    tty: true
    # el default de docker (64mb) se queda corto para la comunicacion
    # intra-nodo de openmpi en hpl/hpcg, por eso lo subimos
    shm_size: 2gb
